version: 2.1
executors:
  reviewed:
    docker:
    - image: cimg/aws@sha256:4cf3768db00ddf9bc439b8c84e8a60c11a14edf81c8baf76f74132144f8340d5
commands:
  checkout-suite:
    steps:
    - run:
        name: Verify the reviewed deployment suite
        command: 'set -euo pipefail

          git init --quiet /tmp/tc-deploy-scripts

          git -C /tmp/tc-deploy-scripts remote add origin https://github.com/topcoder-platform/tc-deploy-scripts.git

          git -C /tmp/tc-deploy-scripts fetch --quiet --depth 1 origin b900d58e38787e3397743412597c6563fe6e08dd

          git -C /tmp/tc-deploy-scripts checkout --quiet --detach FETCH_HEAD

          test "$(git -C /tmp/tc-deploy-scripts rev-parse HEAD)" = b900d58e38787e3397743412597c6563fe6e08dd

          '
jobs:
  build:
    executor: reviewed
    steps:
    - checkout
    - setup_remote_docker
    - checkout-suite
    - run:
        name: Build committed source without AWS or broker credentials
        command: 'set -euo pipefail

          target=development

          if [ "${CIRCLE_BRANCH}" = master ]; then target=production; fi

          python3 -I /tmp/tc-deploy-scripts/build_image.py --target "$target" --dockerfile Dockerfile --image community-app:candidate

          mkdir -p /tmp/release

          docker save --output /tmp/release/image.tar community-app:candidate

          '
        no_output_timeout: 30m
    - persist_to_workspace:
        root: /tmp/release
        paths:
        - image.tar
  deploy:
    executor: reviewed
    parameters:
      environment:
        type: enum
        enum:
        - dev
        - prod
    environment:
      DEPLOY_ENV: << parameters.environment >>
    steps:
    - checkout
    - setup_remote_docker
    - checkout-suite
    - attach_workspace:
        at: /tmp/release
    - run:
        name: Promote a scanned digest with repository-bound OIDC
        command: 'set +x

          set -euo pipefail

          test -f "deploy/${DEPLOY_ENV}.json"

          docker load --input /tmp/release/image.tar

          python3 -I deploy/release.py "deploy/${DEPLOY_ENV}.json"

          '
        no_output_timeout: 45m
  Performance-Testing:
    docker:
    - image: maven:3.9-eclipse-temurin-21@sha256:99e61abcff91a9b1333463bd8451fb18495d6eba9250ac66a338b518f8278320
    working_directory: ~/repo
    environment:
      MAVEN_OPTS: -Xmx3200m
    steps:
    - checkout
    - restore_cache:
        keys:
        - v1-dependencies-{{ checksum "pom.xml" }}
        - v1-dependencies-
    - run: mvn dependency:go-offline
    - save_cache:
        paths:
        - ~/.m2
        key: v1-dependencies-{{ checksum "pom.xml" }}
    - run: mvn verify
    - store_artifacts:
        path: target/jmeter/reports
workflows:
  release:
    jobs:
    - build
    - deploy:
        name: deploy-dev
        environment: dev
        requires:
        - build
        context: community-app-dev-deploy
        serial-group: << pipeline.project.slug >>/deploy-dev
        filters:
          branches:
            only: develop
          tags:
            ignore: /.*/
    - approve-prod:
        type: approval
        requires:
        - build
        filters:
          branches:
            only: master
          tags:
            ignore: /.*/
    - deploy:
        name: deploy-prod
        environment: prod
        requires:
        - approve-prod
        context: community-app-prod-deploy
        serial-group: << pipeline.project.slug >>/deploy-prod
        filters:
          branches:
            only: master
          tags:
            ignore: /.*/
  performance:
    when: << pipeline.parameters.run_performancetesting >>
    jobs:
    - approve-performance:
        type: approval
    - Performance-Testing:
        requires:
        - approve-performance
        filters:
          branches:
            only:
            - develop
            - master
          tags:
            ignore: /.*/
parameters:
  run_performancetesting:
    type: boolean
    default: false
